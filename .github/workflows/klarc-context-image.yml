name: Klarc context-window repair image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: klarc-context-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/klarc-dev/lobehub:context-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/klarc-dev/lobehub
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SHA=${{ github.sha }}
          cache-from: type=gha,scope=klarc-context-lobehub
          cache-to: type=gha,mode=max,scope=klarc-context-lobehub
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/klarc-dev/lobehub@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
